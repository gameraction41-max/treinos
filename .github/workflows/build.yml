name: Gerar APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # O APK sai só como Release: artefatos contam na cota de armazenamento do Actions.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes e build da interface
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync android

      - name: Preparar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/treinos.jks"
            echo "TREINOS_KEYSTORE_PATH=$RUNNER_TEMP/treinos.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret KEYSTORE_BASE64 não configurado. O APK sai assinado com a chave de debug e não vai atualizar por cima de uma versão assinada de verdade."
          fi

      - name: Compilar APK
        working-directory: android
        env:
          TREINOS_VERSION_CODE: ${{ github.run_number }}
          TREINOS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TREINOS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TREINOS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "../treinos-${{ github.run_number }}.apk"

      - name: Publicar Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Treinos build ${{ github.run_number }}
          files: treinos-${{ github.run_number }}.apk
